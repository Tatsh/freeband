jobs:
  build:
    container:
      image: 'ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08'
      options: '--privileged'
    permissions:
      attestations: 'write'
      contents: 'read'
      id-token: 'write'
    runs-on: '${{ matrix.system.image }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - env:
          ARCH: '${{ matrix.system.arch }}'
        id: 'flatpak_bundle'
        name: 'Set Flatpak bundle filename'
        run: |
          version=$(jq -r '.version' package.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "filename=sh.tat.freeband-${version}-${ARCH}.flatpak" >> "$GITHUB_OUTPUT"
      - name: 'Build Flatpak'
        uses: 'flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb'
        with:
          arch: '${{ matrix.system.arch }}'
          bundle: '${{ steps.flatpak_bundle.outputs.filename }}'
          manifest-path: 'sh.tat.freeband.yml'
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'sh.tat.freeband-${{ steps.flatpak_bundle.outputs.version }}-${{ matrix.system.arch }}'
          path: '${{ steps.flatpak_bundle.outputs.filename }}'
      - name: 'Attest'
        uses: 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6'
        with:
          subject-path: '${{ steps.flatpak_bundle.outputs.filename }}'
    strategy:
      matrix:
        system:
          - arch: 'x86_64'
            image: 'ubuntu-latest'
          - arch: 'aarch64'
            image: 'ubuntu-24.04-arm'
  publish:
    if: "github.ref_type == 'tag'"
    needs: ['build']
    permissions:
      contents: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Download bundles'
        uses: 'actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131'
        with:
          merge-multiple: true
          path: 'bundles'
          pattern: 'sh.tat.freeband-*'
      - env:
          EXPECTED: '2'
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        name: 'Upload package'
        run: |
          set -euo pipefail
          mapfile -t files < <(compgen -G 'bundles/*.flatpak' || true)
          if [[ ${#files[@]} -ne $EXPECTED ]]; then
            echo "::error::Expected ${EXPECTED} Flatpak bundles, found ${#files[@]}."
            exit 1
          fi
          for attempt in 1 2 3; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              break
            fi
            if gh release create "$TAG" --draft --title "$TAG" --notes 'Pending release notes.'; then
              break
            fi
            sleep "$((attempt * 5))"
          done
          gh release view "$TAG" > /dev/null
          gh release upload "$TAG" "${files[@]}" --clobber
name: 'Flatpak'
'on':
  push:
    branches:
      - 'master'
    paths:
      - '.github/workflows/flatpak.yml'
      - 'CMakeLists.txt'
      - 'sh.tat.freeband.yml'
      - 'src/**'
      - 'vcpkg.json'
    tags:
      - 'v*.*.*'
permissions:
  contents: 'read'
