env:
  GH_TOKEN: '${{ github.token }}'
  GH_REPO: '${{ github.repository }}'
jobs:
  publish-release:
    runs-on: 'ubuntu-latest'
    steps:
      - env:
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          TRIGGER_CONCLUSION: '${{ github.event.workflow_run.conclusion }}'
        id: 'guard'
        name: 'Check trigger conditions'
        run: |
          if [[ "$TRIGGER_CONCLUSION" != 'success' ]]; then
            echo "Triggering workflow concluded with '${TRIGGER_CONCLUSION}', nothing to do."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=''
          while IFS=$'\t' read -r ref obj_type obj_sha; do
            [[ -z "$ref" ]] && continue
            if [[ "$obj_type" == 'commit' ]]; then
              target_sha="$obj_sha"
            else
              target_sha=$(gh api "repos/${GH_REPO}/git/tags/${obj_sha}" \
                --jq '.object.sha' 2>/dev/null || echo '')
            fi
            if [[ "$target_sha" == "$HEAD_SHA" ]]; then
              tag="${ref#refs/tags/}"
              break
            fi
          done < <(gh api "repos/${GH_REPO}/git/matching-refs/tags/v" \
            --jq '.[] | [.ref, .object.type, .object.sha] | @tsv')
          if [[ -z "$tag" ]]; then
            echo "No v* tag points at ${HEAD_SHA}, nothing to do."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found release tag ${tag} for SHA ${HEAD_SHA}."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo 'proceed=true' >> "$GITHUB_OUTPUT"
      - env:
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
        id: 'check'
        if: "steps.guard.outputs.proceed == 'true'"
        name: 'Check all required workflows succeeded'
        run: |
          # These produce the release assets, so a missing run is a hard failure, not an
          # optional one. The rest are path-filtered and may legitimately not run for a commit.
          required=('Build' 'Flatpak' 'Snap')
          optional=('Prettier' 'Spelling' 'clang-format' 'markdownlint')
          pending=false
          for workflow in "${required[@]}" "${optional[@]}"; do
            run=$(gh run list --workflow "$workflow" --commit "$HEAD_SHA" \
              --json status,conclusion --jq '.[0]')
            if [[ -z "$run" || "$run" == 'null' ]]; then
              if [[ " ${required[*]} " == *" ${workflow} "* ]]; then
                echo "::error::Required workflow '${workflow}' did not run for this commit."
                exit 1
              fi
              echo "Workflow '${workflow}' did not run for this commit; not required."
              continue
            fi
            status=$(jq -r '.status' <<< "$run")
            conclusion=$(jq -r '.conclusion' <<< "$run")
            case "$conclusion" in
              failure|cancelled|timed_out|startup_failure|action_required)
                echo "::error::Workflow '${workflow}' ${conclusion}."
                exit 1
                ;;
              success)
                ;;
              skipped|neutral)
                if [[ " ${required[*]} " == *" ${workflow} "* ]]; then
                  echo "::error::Required workflow '${workflow}' was ${conclusion}."
                  exit 1
                fi
                ;;
              *)
                if [[ "$status" == 'completed' ]]; then
                  echo "::error::Workflow '${workflow}' completed with unexpected conclusion '${conclusion}'."
                  exit 1
                fi
                echo "Workflow '${workflow}' still pending (status=${status})."
                pending=true
                ;;
            esac
          done
          if [[ "$pending" == 'true' ]]; then
            echo 'Not all workflows have completed yet.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - env:
          TAG: '${{ steps.guard.outputs.tag }}'
        id: 'assets'
        if: "steps.check.outputs.ready == 'true'"
        name: 'Check all built assets are attached'
        run: |
          version="${TAG#v}"
          expected=(
            "freeband-${TAG}-x86_64.AppImage"
            "freeband-${version}-Darwin-arm64-Release.dmg"
            "freeband-${version}-Darwin-arm64-Release.zip"
            "freeband-${version}-Darwin-x86_64-Release.dmg"
            "freeband-${version}-Darwin-x86_64-Release.zip"
            "freeband-${version}-win64-Release.exe"
            "freeband-${version}-win64-Release.zip"
            "freeband-${version}-winarm64-Release.exe"
            "freeband-${version}-winarm64-Release.zip"
            "freeband_${version}_amd64.snap"
            "freeband_${version}_arm64.snap"
            "sh.tat.freeband-${version}-aarch64.flatpak"
            "sh.tat.freeband-${version}-x86_64.flatpak"
          )
          mapfile -t attached < <(gh release view "$TAG" --json assets --jq '.assets[].name' \
            | sort)
          printf 'Attached asset(s):\n'
          printf '  %s\n' "${attached[@]}"
          missing=()
          for name in "${expected[@]}"; do
            if [[ " ${attached[*]} " != *" ${name} "* ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Release ${TAG} is missing ${#missing[@]} of ${#expected[@]} expected asset(s):"
            printf '::error::  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All ${#expected[@]} expected asset(s) are attached to ${TAG}."
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - env:
          TAG: '${{ steps.guard.outputs.tag }}'
        if: "steps.assets.outputs.ready == 'true'"
        name: 'Publish release'
        run: 'gh release edit "$TAG" --draft=false'
      - env:
          RUN_ID: '${{ github.run_id }}'
        if: 'always()'
        name: 'Delete prior non-publishing Release runs'
        run: |
          delete_run() {
            local id="$1" reason="$2"
            echo "Deleting prior Release run ${id} (${reason})."
            gh run delete "$id" || true
          }
          published_step_skipped() {
            local id="$1"
            local step_conclusion
            step_conclusion=$(gh api "repos/${GH_REPO}/actions/runs/${id}/jobs" \
              --jq '[.jobs[].steps[] | select(.name == "Publish release")][0].conclusion' 2>/dev/null || echo '')
            [[ "$step_conclusion" == 'skipped' ]]
          }
          gh run list --workflow 'Release' \
            --json databaseId,status,conclusion --limit 100 \
            | jq -r --arg self "$RUN_ID" \
                '.[] | select((.databaseId|tostring) != $self) | select(.status == "completed") | [.databaseId, .conclusion] | @tsv' \
            | while IFS=$'\t' read -r id conclusion; do
                [[ -z "$id" ]] && continue
                case "$conclusion" in
                  skipped|cancelled|neutral)
                    delete_run "$id" "$conclusion"
                    ;;
                  success)
                    if published_step_skipped "$id"; then
                      delete_run "$id" 'success without publish'
                    fi
                    ;;
                esac
              done
      - env:
          RUN_ID: '${{ github.run_id }}'
        if: "steps.assets.outputs.ready != 'true'"
        name: 'Cancel this run so it can be cleaned up'
        run: |
          echo 'This run did not publish; cancelling so a later run can remove it.'
          gh run cancel "$RUN_ID" || true
          sleep 30
name: 'Release'
'on':
  workflow_run:
    types:
      - 'completed'
    workflows:
      - 'Build'
      - 'Flatpak'
      - 'Prettier'
      - 'Snap'
      - 'Spelling'
      - 'clang-format'
      - 'markdownlint'
permissions:
  actions: 'write'
  contents: 'write'
