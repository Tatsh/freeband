concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}'
jobs:
  analyze:
    name: 'Analyze'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - if: "matrix.language == 'c-cpp'"
        name: 'Install dependencies'
        run: 'sudo apt-get update && sudo apt-get install -y freeglut3-dev libsdl-image1.2-dev libsdl-ttf2.0-dev libsdl1.2-dev libsndfile1-dev portaudio19-dev'
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          build-mode: '${{ matrix.build-mode }}'
          languages: '${{ matrix.language }}'
      - if: "matrix.build-mode == 'manual'"
        name: 'Build project'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --config Debug --verbose
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          output: '${{ runner.temp }}/codeql-sarif'
          upload: false
          category: '/language:${{matrix.language}}'
      - if: matrix.language == 'c-cpp' || matrix.language == 'cpp'
        name: Restrict native findings to project sources
        run: python3 .github/scripts/static-analysis.py --sarif "$RUNNER_TEMP/codeql-sarif"
      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{matrix.language}}
          sarif_file: ${{ runner.temp }}/codeql-sarif
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-mode: 'manual'
            language: 'c-cpp'
          - build-mode: 'none'
            language: 'actions'
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.h'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '**/action.yml'
      - '**/action.yaml'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
  push:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.h'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '**/action.yml'
      - '**/action.yaml'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
  schedule:
    - cron: '15 4 * * 3'
permissions: {}
