jobs:
  analyze:
    name: 'Analyze'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Install dependencies'
        run: 'sudo apt-get update && sudo apt-get install -y freeglut3-dev libsdl-image1.2-dev libsdl-ttf2.0-dev libsdl1.2-dev libsndfile1-dev portaudio19-dev'
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938'
        with:
          languages: '${{ matrix.language }}'
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938'
        with:
          category: '/language:${{matrix.language}}'
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'c-cpp'
          - 'actions'
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.h'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '**/action.yml'
      - '**/action.yaml'
  push:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.h'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '**/action.yml'
      - '**/action.yaml'
  schedule:
    - cron: '15 4 * * 3'
