concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref }}'
  queue: 'max'
jobs:
  build-linux:
    name: 'Build (Linux)'
    permissions:
      attestations: 'write'
      contents: 'write'
      id-token: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Install dependencies'
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y \
            freeglut3-dev \
            libsdl-image1.2-dev \
            libsdl-ttf2.0-dev \
            libsdl1.2-dev \
            libsndfile1-dev \
            portaudio19-dev
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: 'Configure'
        run: >-
          cmake -S . -B build -DCMAKE_VERBOSE_MAKEFILE=ON
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCMAKE_INSTALL_PREFIX="$PWD/build/AppDir/usr"
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: 'Build'
        run: 'cmake --build build --config "$BUILD_TYPE" --verbose'
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: 'Install'
        run: 'cmake --install build --config "$BUILD_TYPE" --verbose'
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: 'Create AppImage'
        run: |
          wget 'https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage'
          chmod +x linuxdeploy-x86_64.AppImage
          appdir="$PWD/build/AppDir"
          ./linuxdeploy-x86_64.AppImage \
            --appdir "${appdir}" \
            --desktop-file "${appdir}/usr/share/applications/sh.tat.freeband.desktop" \
            --output appimage
          mv Freeband-*.AppImage "freeband-${BUILD_TYPE}-x86_64.AppImage"
      - env:
          TAG: '${{ github.ref_name }}'
        if: "github.ref_type == 'tag' && matrix.build-type == 'Release'"
        name: 'Rename with tag'
        run: 'mv freeband-Release-x86_64.AppImage "freeband-${TAG}-x86_64.AppImage"'
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'freeband-${{ matrix.build-type }}-Linux'
          path: 'freeband-*.AppImage'
      - name: 'Attest'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: 'freeband-*.AppImage'
      - env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        if: "github.ref_type == 'tag' && matrix.build-type == 'Release'"
        name: 'Upload package'
        run: |
          set -euo pipefail
          mapfile -t files < <(compgen -G 'freeband-*.AppImage' || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No AppImage was produced; refusing to attach a partial release.'
            exit 1
          fi
          for attempt in 1 2 3; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              break
            fi
            if gh release create "$TAG" --draft --title "$TAG" --notes 'Pending release notes.'; then
              break
            fi
            sleep "$((attempt * 5))"
          done
          gh release view "$TAG" > /dev/null
          gh release upload "$TAG" "${files[@]}" --clobber
    strategy:
      fail-fast: false
      matrix:
        build-type: ['Debug', 'Release']
  build-macos:
    env:
      MACOSX_DEPLOYMENT_TARGET: "${{ matrix.os == 'macos-15-intel' && '10.13' || '11.0' }}"
    name: 'Build (macOS)'
    permissions:
      attestations: 'write'
      contents: 'write'
      id-token: 'write'
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Install Homebrew dependencies'
        run: >-
          brew install autoconf automake freeglut libsndfile libtool
          pkg-config portaudio sdl12-compat
      - name: 'Build SDL_image and SDL_ttf from source'
        run: |
          prefix="${HOME}/sdl1-libs"
          mkdir -p "${prefix}"
          git clone --branch release-1.2.12 --depth 1 \
            https://github.com/libsdl-org/SDL_image.git
          (
            cd SDL_image || exit
            touch AUTHORS ChangeLog NEWS
            autoreconf -fi
            ./configure --prefix="${prefix}" --disable-static LIBS=-liconv
            make -j"$(sysctl -n hw.ncpu)"
            make install
          )
          git clone --branch release-2.0.11 --depth 1 \
            https://github.com/libsdl-org/SDL_ttf.git
          (
            cd SDL_ttf || exit
            touch AUTHORS ChangeLog NEWS
            autoreconf -fi
            ./configure --prefix="${prefix}" --disable-static LIBS=-liconv
            make -j"$(sysctl -n hw.ncpu)"
            make install
          )
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: 'Configure, build, install'
        run: |
          cmake -S . -B build -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix"
          cmake --build build --config "$BUILD_TYPE" --verbose
          cmake --install build --config "$BUILD_TYPE" --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: 'Package'
        run: 'cpack -C "$BUILD_TYPE" --config "$PWD/build/CPackConfig.cmake" --verbose'
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'freeband-${{ matrix.build-type }}-${{ matrix.os }}'
          path: |
            freeband-*.dmg
            freeband-*.zip
      - name: 'Attest'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: |
            freeband-*.dmg
            freeband-*.zip
      - env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        if: "github.ref_type == 'tag' && matrix.build-type == 'Release'"
        name: 'Upload package'
        run: |
          set -euo pipefail
          files=()
          for pattern in 'freeband-*.dmg' 'freeband-*.zip'; do
            mapfile -t matches < <(compgen -G "$pattern" || true)
            if [[ ${#matches[@]} -eq 0 ]]; then
              echo "::error::No file matched '${pattern}'; refusing to attach a partial release."
              exit 1
            fi
            files+=("${matches[@]}")
          done
          for attempt in 1 2 3; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              break
            fi
            if gh release create "$TAG" --draft --title "$TAG" --notes 'Pending release notes.'; then
              break
            fi
            sleep "$((attempt * 5))"
          done
          gh release view "$TAG" > /dev/null
          gh release upload "$TAG" "${files[@]}" --clobber
    strategy:
      fail-fast: false
      matrix:
        build-type: ['Debug', 'Release']
        os: ['macos-15-intel', 'macos-latest']
  build-msys:
    name: 'Build (MSYS2)'
    permissions:
      attestations: 'write'
      contents: 'write'
      id-token: 'write'
    runs-on: '${{ matrix.sys.runner }}'
    steps:
      - if: "matrix.sys.name == 'clangarm64'"
        name: 'Install NSIS via Chocolatey'
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
        shell: 'pwsh'
      - uses: 'msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e'
        with:
          install: 'make'
          msystem: '${{ matrix.sys.name }}'
          pacboy: >-
            SDL_image:p SDL_ttf:p cmake:p freeglut:p libsndfile:p ninja:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            pkgconf:p portaudio:p sdl12-compat:p toolchain:p
          path-type: "${{ matrix.sys.name == 'clangarm64' && 'inherit' || 'minimal' }}"
          update: true
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          CPACK_SYSTEM: '${{ matrix.sys.cpack_system }}'
        name: 'Configure'
        run: |
          cmake -G Ninja -B build --install-prefix "$(pwd)/build/prefix" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL_image=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL_ttf=ON \
            -DCPACK_SYSTEM_NAME="$CPACK_SYSTEM"
        shell: 'msys2 {0}'
      - name: 'Build'
        run: 'cmake --build build --verbose'
        shell: 'msys2 {0}'
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: 'Install'
        run: 'cmake --install build --config "$BUILD_TYPE" --verbose'
        shell: 'msys2 {0}'
      - name: 'Inspect install prefix'
        run: |
          echo '== install prefix tree =='
          find build/prefix -maxdepth 4 -print
          echo '== bundled DLLs =='
          find build/prefix -iname '*.dll' -print | sort
        shell: 'msys2 {0}'
      # Release binaries link the release CRT. The scan below reports markers
      # such as VCRUNTIME140D or ucrtbased and fails the job when the
      # executable or a bundled DLL in the install prefix references a debug
      # runtime.
      - if: "matrix.build-type == 'Release'"
        name: 'Check for debug runtime linkage'
        run: |
          $markers = @(
            'VCRUNTIME140D',
            'MSVCP140D',
            'VCOMP140D',
            'CONCRT140D',
            'VCCORLIB140D',
            'ucrtbased',
            'MSVCRTD',
            'MSVCPRTD'
          )
          $binaries = @(Get-ChildItem build/prefix -Recurse -Include *.dll, *.exe)
          if ($binaries.Count -eq 0) {
            Write-Host '::error::No release binaries found to scan.'
            exit 1
          }
          $failed = $false
          $binaries | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            foreach ($marker in $markers) {
              if ($text.Contains($marker)) {
                Write-Host "::error::$($_.Name) references debug runtime $marker."
                $failed = $true
              }
            }
          }
          if ($failed) {
            exit 1
          }
        shell: 'pwsh'
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: 'Package'
        run: 'cpack -C "$BUILD_TYPE" --config "$(pwd)/build/CPackConfig.cmake" --verbose'
        shell: 'msys2 {0}'
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'freeband-${{ matrix.build-type }}-${{ matrix.sys.name }}'
          path: |
            freeband-*.exe
            freeband-*.zip
      - name: 'Attest'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: |
            freeband-*.exe
            freeband-*.zip
      - env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        if: "github.ref_type == 'tag' && matrix.sys.release && matrix.build-type == 'Release'"
        name: 'Upload package'
        run: |
          set -euo pipefail
          files=()
          for pattern in 'freeband-*.exe' 'freeband-*.zip'; do
            mapfile -t matches < <(compgen -G "$pattern" || true)
            if [[ ${#matches[@]} -eq 0 ]]; then
              echo "::error::No file matched '${pattern}'; refusing to attach a partial release."
              exit 1
            fi
            files+=("${matches[@]}")
          done
          for attempt in 1 2 3; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              break
            fi
            if gh release create "$TAG" --draft --title "$TAG" --notes 'Pending release notes.'; then
              break
            fi
            sleep "$((attempt * 5))"
          done
          gh release view "$TAG" > /dev/null
          gh release upload "$TAG" "${files[@]}" --clobber
        shell: 'bash'
    strategy:
      fail-fast: false
      matrix:
        build-type: ['Debug', 'Release']
        sys:
          - cpack_system: 'win64'
            name: 'mingw64'
            release: false
            runner: 'windows-latest'
          - cpack_system: 'win64'
            name: 'ucrt64'
            release: true
            runner: 'windows-latest'
          - cpack_system: 'winarm64'
            name: 'clangarm64'
            release: true
            runner: 'windows-11-arm'
name: 'Build'
'on':
  pull_request:
    branches: ['master']
  push:
    branches: ['master']
    tags:
      - 'v*.*.*'
permissions:
  contents: 'read'
